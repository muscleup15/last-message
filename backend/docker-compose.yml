services:
  db:
    image: postgres:17
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: lastmessage
      POSTGRES_DB: last_message
      POSTGRES_PASSWORD: 12341234
    ports:
      - "5432:5432"
  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
volumes:
  db-data: